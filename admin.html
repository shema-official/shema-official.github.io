<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찬양팀 조사 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="common.js"></script>
</head>
<body class="selection:bg-brand-100 selection:text-brand-700">
<main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
  <div id="app"></div>
</main>
<script>
header('관리자 · 일정, 팀 구성, 연습표 관리');
let D, pw = '', tab = 'home';
try { pw = sessionStorage.getItem('pw') || ''; } catch {}
const M = () => $('#month').value;
// 등록된 포지션만 인정한다(등록 순서 유지).
const posOf = m => { const mine = (m?.positions || '').split(','); return D.positions.map(p => p.name).filter(n => mine.includes(n)); };
const TABS = [['home', '현황', 'activity'], ['sched', '일정', 'calendar-days'], ['team', '팀 구성', 'users'], ['table', '표 만들기', 'table-2']];

async function load() {
  if (!pw) return renderLogin();
  $('#app').innerHTML = SKELETON;
  try { D = await get(M()); render(); }
  catch (e) { $('#app').innerHTML = `<div class="card p-8 text-center text-sm text-slate-500">불러오기 실패: ${esc(e.message)}</div>`; }
}

function renderLogin() {
  $('#app').innerHTML = `<div class="card max-w-sm mx-auto mt-10 p-8 text-center fade-in">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center pop"><i data-lucide="lock" class="w-7 h-7"></i></div>
    <h2 class="text-xl font-bold mt-4">관리자 로그인</h2><p class="text-sm text-slate-500 mt-1">관리자 비밀번호를 입력하세요.</p>
    <form id="loginForm" class="mt-6 space-y-3"><input type="password" id="pw" placeholder="비밀번호" class="inp" autofocus>
      <button class="btn btn-primary w-full">로그인</button></form></div>`;
  icons();
  $('#loginForm').onsubmit = e => {
    e.preventDefault();
    run(e.submitter, async () => {
      await post({ action: 'auth', pw: $('#pw').value });
      pw = $('#pw').value;
      try { sessionStorage.setItem('pw', pw); } catch {}
      load();
    }, '확인 중…');
  };
}

// 저장 응답에 실려 온 최신 데이터로 화면을 갱신한다.
const act = (btn, body, msg = '저장했습니다.') => run(btn, async () => { D = (await post({ pw, month: M(), ...body })).data; render(); toast(msg, 'ok'); });

const del = '<button class="del p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition-all" title="삭제" aria-label="삭제"><i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i></button>';
const sw = (on, label) => `<label class="sw text-xs font-semibold text-slate-600"><input type="checkbox" ${on ? 'checked' : ''}><i></i>${label}</label>`;
const small = 'w-full min-w-0 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white';

const evRow = ev => `<div data-id="${esc(ev.id)}" data-kind="${esc(ev.kind)}" class="ev p-3 sm:p-4 rounded-xl border bg-white border-slate-200 flex flex-col sm:flex-row sm:items-center gap-3 fade-in has-[.sw_:checked]:bg-slate-50 has-[.sw_:checked]:opacity-70">
  <span class="w-12 shrink-0 text-center text-[11px] font-bold px-2 py-1 rounded-md ${ev.kind === '추가' ? 'bg-violet-100 text-violet-700' : 'bg-brand-50 text-brand-700'}">${ev.kind === '추가' ? '추가' : '정기'}</span>
  <div class="grid grid-cols-[1fr_1fr] sm:grid-cols-[150px_1fr_120px] gap-2 flex-1">
    <input type="date" value="${esc(ev.date)}" class="${small}"><input value="${esc(ev.label)}" placeholder="연습 이름" class="${small}">
    <input value="${esc(ev.time)}" placeholder="시간 (예: 오후 4시)" class="${small} col-span-2 sm:col-span-1"></div>
  <div class="flex items-center justify-between sm:justify-end gap-3">${sw(ev.off === 'TRUE', '연습 없음')}${del}</div></div>`;

// 포지션은 칩으로 보여주고, 추가/삭제하면 바로 저장한다.
const posChip = (p, i) => `<div class="inline-flex items-center gap-1.5 pl-3 pr-1.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-800 fade-in">
  <span>${esc(p.name)}</span>
  <button data-delpos="${i}" class="p-0.5 text-slate-400 hover:text-rose-600 transition-all" aria-label="${esc(p.name)} 삭제"><i data-lucide="x" class="w-3.5 h-3.5 pointer-events-none"></i></button></div>`;

const memRow = m => `<div class="mem py-4 flex flex-col md:flex-row md:items-center gap-3 fade-in">
  <div class="flex items-center gap-3 md:w-56 shrink-0">
    <div class="w-9 h-9 shrink-0 rounded-xl bg-brand-50 text-brand-700 font-bold text-sm flex items-center justify-center">${esc(m.name.charAt(0)) || '?'}</div>
    <input value="${esc(m.name)}" placeholder="이름" class="${small} flex-1 min-w-0 font-bold"></div>
  <div class="flex flex-wrap gap-1.5 flex-1">${D.positions.map(p => `<label class="cursor-pointer px-2.5 py-1 rounded-lg text-xs font-semibold border transition-all bg-white text-slate-600 border-slate-200 hover:border-slate-300 has-[:checked]:bg-brand-600 has-[:checked]:text-white has-[:checked]:border-brand-600">
    <input type="checkbox" class="sr-only" value="${esc(p.name)}" ${posOf(m).includes(p.name) ? 'checked' : ''}>${esc(p.name)}</label>`).join('') || '<span class="text-xs text-slate-400">포지션을 먼저 등록하세요</span>'}</div>
  <div class="flex items-center justify-between md:justify-end gap-3">${sw(m.active !== 'FALSE', '활동')}${del}</div></div>`;

function render() {
  const open = D.events.filter(e => e.off !== 'TRUE');
  const evById = Object.fromEntries(D.events.map(e => [e.id, e]));
  const pending = D.requests.filter(q => q.status === 'pending' && evById[q.eventId]);
  const cur = q => D.responses.find(r => r.eventId === q.eventId && r.name === q.name);
  const act_ = D.members.filter(m => m.active === 'TRUE');
  const missing = act_.filter(m => open.some(ev => !D.responses.some(r => r.eventId === ev.id && r.name === m.name)));
  const total = act_.length, done = total - missing.length, pct = total ? Math.round(done / total * 100) : 0;
  const pill = r => r.attend === 'Y' ? `<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold">참석</span>`
    : `<span class="px-2 py-0.5 rounded bg-rose-50 text-rose-700 font-semibold">불참 (${esc(r.reason)} · 주일 ${r.sundayOk === 'Y' ? '가능' : '불가'})</span>`;

  $('#app').innerHTML = `
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4 mb-6">
    <div><h2 class="text-xl sm:text-2xl font-bold tracking-tight">찬양팀 연습 관리</h2>
      <p class="text-sm text-slate-500 mt-0.5">${+M().slice(5)}월 연습 참여 현황과 단톡방 공유용 표</p></div>
    <nav class="flex items-center gap-1 bg-slate-200/70 p-1.5 rounded-xl self-start sm:self-auto overflow-x-auto max-w-full">${TABS.map(([k, t, ic]) =>
      `<button data-tab="${k}" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition-all text-slate-600 hover:text-slate-900">
        <i data-lucide="${ic}" class="w-4 h-4"></i>${t}${k === 'home' && pending.length ? `<span class="px-1.5 bg-rose-500 text-white text-[10px] font-bold rounded-full">${pending.length}</span>` : ''}</button>`).join('')}</nav>
  </div>

  <div data-pane="home" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="card p-5 flex flex-col justify-between fade-in">
        <div class="flex items-center justify-between"><span class="eyebrow text-slate-400">조사 상태</span><span class="w-2.5 h-2.5 rounded-full ${D.open ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}"></span></div>
        <div class="my-4"><h3 class="text-2xl font-bold">${D.open ? '조사 진행 중' : '조사 마감'}</h3>
          <p class="text-xs text-slate-500 mt-1">${D.open ? '멤버 응답이 바로 반영됩니다.' : '멤버의 변경은 수정 요청으로 들어옵니다.'}</p></div>
        <button id="toggle" class="btn ${D.open ? 'bg-amber-50 border-amber-300 text-amber-800 hover:bg-amber-100' : 'bg-emerald-50 border-emerald-300 text-emerald-800 hover:bg-emerald-100'}">
          <i data-lucide="${D.open ? 'lock' : 'unlock'}" class="w-3.5 h-3.5"></i>${D.open ? '이번 달 조사 마감하기' : '조사 다시 열기'}</button>
      </div>
      <div class="card p-5 flex flex-col justify-between fade-in" style="animation-delay:60ms">
        <div class="flex items-center justify-between"><span class="eyebrow text-slate-400">응답률</span><span class="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">${pct}%</span></div>
        <div class="my-4"><h3 class="text-2xl font-bold mb-2">${done} / ${total}명 <span class="text-sm font-normal text-slate-500">응답 완료</span></h3>
          <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-brand-500 to-violet-500 rounded-full transition-all duration-700" style="width:${pct}%"></div></div></div>
        <button data-go="table" class="text-xs text-brand-600 font-semibold hover:underline flex items-center gap-0.5 self-end">표 보러가기 <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
      </div>
      <div class="card p-5 flex flex-col justify-between fade-in" style="animation-delay:120ms">
        <div class="flex items-center justify-between"><span class="eyebrow text-slate-400">미응답 멤버</span><span class="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200/60 px-2 py-0.5 rounded-md">${missing.length}명</span></div>
        <div class="my-3 flex flex-wrap gap-1.5 items-center min-h-[48px]">${missing.map(m => `<span class="px-2.5 py-1 rounded-lg bg-amber-50 border border-amber-200/80 text-amber-900 text-xs font-bold">${esc(m.name)}</span>`).join('')
          || '<span class="text-xs font-semibold text-emerald-600 flex items-center gap-1"><i data-lucide="party-popper" class="w-4 h-4"></i>모두 응답했습니다!</span>'}</div>
        <button id="remind" class="btn btn-dark" ${missing.length ? '' : 'disabled'}><i data-lucide="copy" class="w-3.5 h-3.5"></i>독촉 메시지 복사</button>
      </div>
    </div>

    <div class="card overflow-hidden fade-in">
      <div class="p-5 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center"><i data-lucide="git-pull-request" class="w-4 h-4"></i></div>
          <div><div class="flex items-center gap-2"><h3 class="font-bold">마감 후 수정 요청</h3><span class="px-2 py-0.5 text-xs font-bold rounded-full bg-rose-100 text-rose-700">${pending.length}건</span></div>
            <p class="text-xs text-slate-500 mt-0.5">승인하면 표에 바로 반영됩니다.</p></div></div>
        ${pending.length > 1 ? '<button id="okAll" class="btn btn-primary self-start sm:self-auto"><i data-lucide="check-check" class="w-4 h-4"></i>전체 승인</button>' : ''}
      </div>
      <div class="divide-y divide-slate-100">${pending.map(q => `<div class="p-5 sm:p-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4 hover:bg-slate-50/50 transition-all">
        <div class="space-y-2.5 flex-1">
          <div class="flex items-center gap-2"><span class="font-bold">${esc(q.name)}</span><span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${esc(posOf(D.members.find(m => m.name === q.name)).join(' · '))}</span></div>
          <div class="flex flex-wrap items-center gap-2 text-xs bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
            <span class="font-bold text-slate-800">${esc(evName(evById[q.eventId]))}</span>${cur(q) ? pill(cur(q)) : '<span class="text-slate-400">미응답</span>'}
            <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-400"></i>${pill(q)}</div>
          ${q.note ? `<p class="text-xs text-slate-600 bg-amber-50/70 border border-amber-200/60 px-3 py-2 rounded-lg"><strong class="text-amber-800">요청 메모:</strong> ${esc(q.note)}</p>` : ''}
        </div>
        <div class="flex items-center gap-2 self-end lg:self-center shrink-0">
          <button data-no="${esc(q.id)}" class="btn">반려</button>
          <button data-ok="${esc(q.id)}" class="btn btn-primary"><i data-lucide="check" class="w-3.5 h-3.5"></i>승인</button></div>
      </div>`).join('') || '<div class="p-8 text-center"><p class="text-sm font-semibold text-slate-500">대기 중인 수정 요청이 없습니다</p><p class="text-xs text-slate-400 mt-1">조사가 마감된 뒤 멤버가 응답을 바꾸면 여기에 표시됩니다.</p></div>'}</div>
    </div>

    <div class="card overflow-hidden fade-in">
      <div class="p-5 sm:p-6 border-b border-slate-100"><h3 class="font-bold">멤버별 응답 현황</h3></div>
      <div class="p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${act_.map(m => {
        const rs = D.responses.filter(r => r.name === m.name && open.some(e => e.id === r.eventId));
        const y = rs.filter(r => r.attend === 'Y').length, n = rs.length - y;
        return `<div class="p-3.5 rounded-xl border border-slate-200/80 flex items-center justify-between gap-2">
          <div class="min-w-0"><span class="font-bold text-sm">${esc(m.name)}</span> <span class="text-xs text-slate-500">${esc(posOf(m).join('·'))}</span></div>
          <div class="flex gap-1 shrink-0">${rs.length ? `<span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">참석 ${y}</span>${n ? `<span class="text-[11px] font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md">불참 ${n}</span>` : ''}`
            : '<span class="text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">미응답</span>'}</div></div>`;
      }).join('')}</div>
    </div>
  </div>

  <div data-pane="sched" class="card p-5 sm:p-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-5 border-b border-slate-100">
      <div><h3 class="font-bold">${+M().slice(5)}월 연습 일정</h3><p class="text-xs text-slate-500 mt-0.5">일정을 삭제하면 그 일정의 응답도 표에서 빠집니다.</p></div>
      <div class="flex flex-wrap gap-2"><button id="sat" class="btn bg-brand-50 border-brand-200/60 text-brand-700 hover:bg-brand-100"><i data-lucide="wand-2" class="w-3.5 h-3.5"></i>토요일 자동 추가</button>
        <button id="addEv" class="btn"><i data-lucide="plus" class="w-4 h-4"></i>추가 연습</button>
        <button id="saveEv" class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i>일정 저장</button></div>
    </div>
    <div id="evs" class="mt-5 space-y-3">${D.events.map(evRow).join('')}</div>
  </div>

  <div data-pane="team" class="space-y-6">
    <div class="card p-5 sm:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div><h3 class="font-bold">포지션 관리</h3><p class="text-xs text-slate-500 mt-0.5">표에는 여기 등록된 포지션만 이 순서대로 나옵니다.</p></div>
        <form id="posForm" class="flex items-center gap-2 w-full sm:w-auto">
          <input id="posName" required placeholder="새 포지션" class="${small} flex-1 sm:flex-none sm:w-44">
          <button class="btn btn-dark shrink-0 py-2">+ 추가</button></form>
      </div>
      <div id="poss" class="flex flex-wrap gap-2">${D.positions.map(posChip).join('') || '<p class="text-sm text-slate-400">등록된 포지션이 없습니다.</p>'}</div>
    </div>
    <div class="card p-5 sm:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
        <div><h3 class="font-bold">멤버와 담당 포지션</h3><p class="text-xs text-slate-500 mt-0.5">포지션을 눌러 여러 개 배정할 수 있습니다. 포지션 이름을 바꿨다면 멤버도 다시 저장하세요.</p></div>
        <div class="flex gap-2"><button id="addMem" class="btn"><i data-lucide="user-plus" class="w-4 h-4"></i>멤버</button>
          <button id="saveMem" class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i>멤버 저장</button></div>
      </div>
      <div id="mems" class="divide-y divide-slate-100">${D.members.map(memRow).join('')}</div>
    </div>
  </div>

  <div data-pane="table" class="space-y-6">
    <div class="card p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center shrink-0"><i data-lucide="share-2" class="w-5 h-5"></i></div>
        <div><h3 class="font-bold text-sm sm:text-base">단톡방 공유용 연습 참여표</h3><p class="text-xs text-slate-500">아래 카드가 그대로 이미지로 만들어집니다.</p></div></div>
      <div class="grid grid-cols-2 sm:flex gap-2"><button id="copy" class="btn"><i data-lucide="clipboard-copy" class="w-4 h-4"></i>클립보드에 복사</button>
        <button id="png" class="btn btn-primary"><i data-lucide="download" class="w-4 h-4"></i>PNG로 저장</button></div>
    </div>
    <div class="overflow-x-auto pb-4"><div id="capture" class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 min-w-[720px] space-y-8">${sheet(open, evById)}</div></div>
  </div>`;
  showTab(tab);
}

function showTab(k) {
  tab = k;
  document.querySelectorAll('[data-tab]').forEach(b => {
    const on = b.dataset.tab === k;
    b.classList.toggle('bg-white', on); b.classList.toggle('shadow-sm', on); b.classList.toggle('text-slate-900', on);
  });
  document.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== k; p.classList.toggle('fade-in', !p.hidden); });
  icons();
}

function sheet(open, evById) {
  const head = `<div class="flex items-end justify-between border-b-2 border-slate-900 pb-5">
    <div><div class="inline-block px-2.5 py-1 rounded-md bg-brand-600 text-white text-xs font-bold mb-2">PRAISE TEAM SCHEDULE</div>
      <h2 class="text-2xl font-extrabold tracking-tight">${M().slice(0, 4)}년 ${+M().slice(5)}월 찬양팀 연습 참여표</h2></div>
    <span class="text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg">연습 ${open.length}회</span></div>`;
  return head + section('brand', '날짜별 · 포지션별 참석자', table1(open)) + section('rose', '불참자와 주일 예배 참석 여부', absent(evById));
}
const section = (c, t, body) => `<div><div class="flex items-center gap-2 mb-3"><span class="w-2 h-5 rounded-sm bg-${c === 'brand' ? 'brand-600' : 'rose-500'}"></span><h3 class="font-bold">${t}</h3></div>${body}</div>`;

function table1(open) {
  if (!open.length) return '<p class="text-sm text-slate-500">연습 일정이 없습니다.</p>';
  if (!D.positions.length) return '<p class="text-sm text-slate-500">포지션을 먼저 등록하세요.</p>';
  const byName = Object.fromEntries(D.members.map(m => [m.name, posOf(m)]));
  // 응답에 고른 역할이 있으면 그 역할로, 없으면(예전 응답) 멤버의 모든 포지션으로 센다.
  const cols = open.map(ev => D.responses.filter(r => r.eventId === ev.id && r.attend === 'Y'));
  const roles = r => r.roles ? r.roles.split(',') : byName[r.name] || [];
  return `<div class="overflow-hidden rounded-2xl border border-slate-200"><table class="w-full text-left border-collapse text-sm">
    <thead><tr class="bg-slate-900 text-white text-xs"><th class="px-3 py-3">포지션</th>${open.map(ev =>
      `<th class="px-3 py-3 text-center">${fmt(ev.date)}<div class="font-normal text-slate-300 mt-0.5">${esc(ev.label)}</div></th>`).join('')}</tr></thead>
    <tbody class="divide-y divide-slate-200">${D.positions.map((p, i) => `<tr><th class="px-3 py-2.5 font-bold whitespace-nowrap">${esc(p.name)}</th>${cols.map(ns => {
      const who = ns.filter(r => roles(r).includes(p.name)).map(r => r.name);
      return who.length ? `<td class="px-3 py-2.5 text-center">${who.map(esc).join('<br>')}</td>`
        : '<td class="px-3 py-2.5 text-center bg-rose-50/60"><span class="text-[11px] font-bold text-rose-600 bg-rose-100 px-2 py-0.5 rounded-md">공석</span></td>';
    }).join('')}</tr>`).join('')}
    <tr class="bg-brand-50 font-bold text-brand-700"><th class="px-3 py-2.5">참석 인원</th>${cols.map(ns => `<td class="px-3 py-2.5 text-center">${ns.length}명</td>`).join('')}</tr></tbody></table></div>`;
}

function absent(evById) {
  const byName = Object.fromEntries(D.members.map(m => [m.name, m]));
  const days = D.events.filter(e => e.off !== 'TRUE').map(ev => [ev, D.responses.filter(r => r.eventId === ev.id && r.attend === 'N')]).filter(([, rs]) => rs.length);
  if (!days.length) return '<p class="text-sm text-slate-500">불참자가 없습니다.</p>';
  return `<div class="flex justify-end gap-3 text-xs mb-2"><span class="flex items-center gap-1 text-slate-600"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>주일 예배 가능</span>
    <span class="flex items-center gap-1 text-slate-600"><span class="w-2 h-2 rounded-full bg-rose-500"></span>주일 예배 불가</span></div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${days.map(([ev, rs]) => `<div class="rounded-2xl border border-slate-200 overflow-hidden">
      <div class="bg-slate-50 px-3.5 py-2.5 border-b border-slate-200"><b class="text-sm">${fmt(ev.date)}</b> <span class="text-xs text-slate-500">${esc(ev.label)}</span></div>
      <div class="p-3.5 space-y-2.5">${rs.map(r => `<div><div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full shrink-0 ${r.sundayOk === 'Y' ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
        <b class="text-sm">${esc(r.name)}</b><span class="text-[11px] text-slate-400">${esc(posOf(byName[r.name]).join('·'))}</span></div>
        <p class="text-xs text-slate-500 pl-3.5 mt-0.5">${esc(r.reason)}</p></div>`).join('')}</div></div>`).join('')}</div>`;
}

document.addEventListener('submit', e => {
  if (e.target.id !== 'posForm') return;
  e.preventDefault();
  const name = $('#posName').value.trim();
  if (D.positions.some(p => p.name === name)) return toast('이미 있는 포지션입니다.', 'err');
  act(e.submitter, { action: 'savePositions', positions: [...D.positions, { name, kind: '' }] }, `'${name}' 포지션을 추가했습니다.`);
});

function addSaturdays() {
  const [y, m] = M().split('-').map(Number);
  const have = new Set([...document.querySelectorAll('#evs .ev')].map(r => r.querySelector('input').value));
  let n = 0;
  for (let d = new Date(y, m - 1, 1); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) {
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (d.getDay() === 6 && !have.has(iso)) $('#evs').insertAdjacentHTML('beforeend', evRow({ kind: '정기', label: '토요 연습', date: iso, time: '', id: '' })), n++;
  }
  icons();
  toast(n ? `토요일 ${n}개를 추가했습니다. 저장을 눌러야 반영됩니다.` : '이미 모든 토요일이 있습니다.');
}

function saveEvents(btn) {
  const events = [...document.querySelectorAll('#evs .ev')].map(r => {
    const [d, l, t, o] = r.querySelectorAll('input');
    return { id: r.dataset.id, kind: r.dataset.kind, date: d.value, label: l.value, time: t.value, off: o.checked };
  }).filter(e => e.date);
  const wrong = events.filter(e => !e.date.startsWith(M()));
  if (wrong.length) return toast(`${M()}에 속하지 않는 날짜가 있습니다: ${wrong.map(e => e.date).join(', ')}`, 'err');
  act(btn, { action: 'saveEvents', events }, '일정을 저장했습니다.');
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('클립보드에 복사했습니다.', 'ok'); }
  catch { prompt('아래 내용을 복사하세요.', text); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const add = (box, html) => { $(box).insertAdjacentHTML('beforeend', html); icons(); };
  if (b.dataset.tab) showTab(b.dataset.tab);
  else if (b.dataset.go) showTab(b.dataset.go);
  else if (b.classList.contains('del')) b.closest('.ev, .pos, .mem').remove();
  else if (b.dataset.ok) act(b, { action: 'decide', approve: true, ids: [b.dataset.ok] }, '승인했습니다.');
  else if (b.dataset.no) act(b, { action: 'decide', approve: false, ids: [b.dataset.no] }, '반려했습니다.');
  else if (b.id === 'okAll') act(b, { action: 'decide', approve: true, ids: D.requests.filter(q => q.status === 'pending').map(q => q.id) }, '모두 승인했습니다.');
  else if (b.id === 'toggle') act(b, { action: 'setOpen', open: !D.open }, D.open ? '조사를 마감했습니다.' : '조사를 열었습니다.');
  else if (b.id === 'remind') {
    const open = D.events.filter(e => e.off !== 'TRUE');
    const names = D.members.filter(m => m.active === 'TRUE' && open.some(ev => !D.responses.some(r => r.eventId === ev.id && r.name === m.name))).map(m => m.name);
    copy(`[찬양팀 ${+M().slice(5)}월 연습 참여 조사]\n아직 응답하지 않으신 ${names.join(', ')}님, 링크에서 참석 여부를 체크해 주세요! 🙏\n${location.href.replace(/admin\.html.*$/, '')}`);
  }
  else if (b.id === 'sat') addSaturdays();
  else if (b.id === 'addEv') add('#evs', evRow({ kind: '추가', label: '추가 연습', date: '', time: '', id: '' }));
  else if (b.id === 'saveEv') saveEvents(b);
  else if (b.dataset.delpos) {
    const p = D.positions[+b.dataset.delpos];
    if (confirm(`'${p.name}' 포지션을 삭제할까요? 이 포지션을 가진 멤버에게서도 빠집니다.`))
      act(b, { action: 'savePositions', positions: D.positions.filter(q => q !== p) }, '포지션을 삭제했습니다.');
  }
  else if (b.id === 'addMem') add('#mems', memRow({ name: '', positions: '', active: 'TRUE' }));
  else if (b.id === 'saveMem') act(b, { action: 'saveMembers', members: [...document.querySelectorAll('#mems .mem')].map(r => ({
    name: r.querySelector('input').value,
    positions: [...r.querySelectorAll('label:not(.sw) input:checked')].map(c => c.value),
    active: r.querySelector('.sw input').checked,
  })) }, '멤버를 저장했습니다.');
  else if (b.id === 'copy') run(b, async () => {
    // Safari 는 사용자 클릭 직후에 write 를 불러야 해서 Blob 대신 Promise 를 넘긴다.
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': shot() })]); }
    catch { throw new Error('이 브라우저에서는 이미지 복사가 막혀 있어요. PNG로 저장을 이용해주세요.'); }
    toast('표 이미지를 복사했습니다. 단톡방에 붙여 넣으세요.', 'ok');
  }, '이미지 만드는 중…');
  else if (b.id === 'png') run(b, async () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await shot());
    a.download = `${M()}-연습참여표.png`;
    a.click();
  }, '이미지 만드는 중…');
});

// html-to-image 는 브라우저가 그린 모습을 그대로 이미지로 만든다(html2canvas 는 글자 위치가 어긋났다).
// 가로 스크롤 상자 안에서 잘리지 않도록 캡처 영역 전체 너비로 그린다.
const shot = () => { const el = $('#capture'); return htmlToImage.toBlob(el, { pixelRatio: 2, backgroundColor: '#fff', width: el.scrollWidth, height: el.scrollHeight }); };

$('#month').value = nextMonth();
$('#month').onchange = load;
icons();
load();
</script>
</body>
</html>
