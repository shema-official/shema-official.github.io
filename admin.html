<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찬양팀 조사 관리자</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<main>
  <header>
    <h1>찬양팀 조사 관리자</h1>
    <input type="month" id="month" aria-label="관리 월">
  </header>
  <div id="app"></div>
</main>
<script src="common.js"></script>
<script>
let D, pw = '';
try { pw = sessionStorage.getItem('pw') || ''; } catch {}
const M = () => $('#month').value;
const posOf = m => (m?.positions || '').split(',').map(s => s.trim()).filter(Boolean);

async function load() {
  if (!pw) return renderLogin();
  $('#app').textContent = '불러오는 중…';
  try { D = await get(M()); render(); }
  catch (e) { $('#app').textContent = '불러오기 실패: ' + e.message; }
}

function renderLogin() {
  $('#app').innerHTML = `<section><h2>관리자 로그인</h2><div class="row">
    <input type="password" id="pw" placeholder="비밀번호"><button id="login" class="primary">확인</button></div></section>`;
  $('#login').onclick = e => run(e.target, async () => {
    await post({ action: 'auth', pw: $('#pw').value });
    pw = $('#pw').value;
    try { sessionStorage.setItem('pw', pw); } catch {}
    load();
  });
}

// 저장 후 다시 불러와 화면을 갱신한다.
const act = (btn, body) => run(btn, async () => { await post({ pw, month: M(), ...body }); D = await get(M()); render(); });

const evRow = ev => `<tr data-id="${esc(ev.id)}" data-kind="${esc(ev.kind)}">
  <td><input type="date" value="${esc(ev.date)}"></td>
  <td><input value="${esc(ev.label)}" placeholder="이름"></td>
  <td><input type="time" value="${esc(ev.time)}"></td>
  <td><label><input type="checkbox" ${ev.off === 'TRUE' ? 'checked' : ''}> 연습 없음</label></td>
  <td><button class="del" title="삭제">✕</button></td></tr>`;

const memRow = m => `<tr>
  <td><input value="${esc(m.name)}" placeholder="이름"></td>
  <td><input value="${esc(m.positions)}" placeholder="보컬,건반"></td>
  <td><label><input type="checkbox" ${m.active !== 'FALSE' ? 'checked' : ''}> 활동</label></td>
  <td><button class="del" title="삭제">✕</button></td></tr>`;

function render() {
  const open = D.events.filter(e => e.off !== 'TRUE');
  const evById = Object.fromEntries(D.events.map(e => [e.id, e]));
  const pending = D.requests.filter(q => q.status === 'pending');
  const cur = (q) => D.responses.find(r => r.eventId === q.eventId && r.name === q.name);
  const missing = D.members.filter(m => m.active === 'TRUE' &&
    open.some(ev => !D.responses.some(r => r.eventId === ev.id && r.name === m.name)));

  $('#app').innerHTML = `
  <section><h2>${M()} 조사 상태</h2>
    <p class="banner ${D.open ? '' : 'closed'}">${D.open ? '조사 진행 중: 멤버 응답이 바로 반영됩니다.' : '마감됨: 멤버 변경은 수정 요청으로 들어옵니다.'}</p>
    <button id="toggle" class="primary">${D.open ? '조사 마감하기' : '조사 열기'}</button></section>

  <section><h2>수정 요청 (${pending.length}건)</h2>
    ${pending.length ? `<div class="wide"><table><thead><tr><th>이름</th><th>일정</th><th>기존</th><th>요청</th><th>사유</th><th></th></tr></thead><tbody>
    ${pending.map(q => `<tr><td>${esc(q.name)}</td><td>${esc(evName(evById[q.eventId]))}</td>
      <td>${cur(q) ? esc(ansText(cur(q))) : '미응답'}</td><td>${esc(ansText(q))}</td><td>${esc(q.note)}</td>
      <td><button data-ok="${esc(q.id)}">승인</button> <button data-no="${esc(q.id)}">반려</button></td></tr>`).join('')}
    </tbody></table></div><div class="row"><button id="okAll" class="primary">전체 승인</button></div>` : '<p class="muted">대기 중인 요청이 없습니다.</p>'}</section>

  <section><h2>연습 일정</h2>
    <div class="wide"><table class="edit" id="evs"><tbody>${D.events.map(evRow).join('')}</tbody></table></div>
    <div class="row"><button id="sat">토요일 자동 추가</button><button id="addEv">추가 연습 +</button><button id="saveEv" class="primary">일정 저장</button></div>
    <p class="muted">일정을 삭제하면 그 일정에 대한 응답도 표에서 빠집니다.</p></section>

  <section><h2>멤버</h2>
    <p class="muted">포지션은 쉼표로 구분합니다: ${esc(POSITIONS.join(', '))}</p>
    <div class="wide"><table class="edit" id="mems"><tbody>${D.members.map(memRow).join('')}</tbody></table></div>
    <div class="row"><button id="addMem">멤버 +</button><button id="saveMem" class="primary">멤버 저장</button></div></section>

  <section><h2>미응답자 (${missing.length}명)</h2>
    <p>${missing.length ? esc(missing.map(m => m.name).join(', ')) : '모두 응답했습니다.'}</p></section>

  <section><h2>참석 현황표</h2><div class="wide sheet" id="t1">${table1(open)}</div>
    <div class="row"><button data-png="t1" class="primary">PNG 저장</button></div></section>

  <section><h2>불참자 정리표</h2><div class="wide sheet" id="t2">${table2(evById)}</div>
    <div class="row"><button data-png="t2" class="primary">PNG 저장</button></div></section>`;

  $('#toggle').onclick = e => act(e.target, { action: 'setOpen', open: !D.open });
  $('#okAll')?.addEventListener('click', e => act(e.target, { action: 'decide', approve: true, ids: pending.map(q => q.id) }));
  $('#sat').onclick = addSaturdays;
  $('#addEv').onclick = () => $('#evs tbody').insertAdjacentHTML('beforeend', evRow({ kind: '추가', label: '추가 연습', date: '', time: '', id: '' }));
  $('#addMem').onclick = () => $('#mems tbody').insertAdjacentHTML('beforeend', memRow({ name: '', positions: '', active: 'TRUE' }));
  $('#saveEv').onclick = e => saveEvents(e.target);
  $('#saveMem').onclick = e => act(e.target, { action: 'saveMembers', members: [...$('#mems tbody').rows].map(tr => {
    const [n, p, a] = tr.querySelectorAll('input');
    return { name: n.value, positions: p.value, active: a.checked };
  }) });
}

function addSaturdays() {
  const [y, m] = M().split('-').map(Number);
  const have = new Set([...$('#evs tbody').rows].map(tr => tr.querySelector('input').value));
  for (let d = new Date(y, m - 1, 1); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) {
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (d.getDay() === 6 && !have.has(iso))
      $('#evs tbody').insertAdjacentHTML('beforeend', evRow({ kind: '정기', label: '토요 연습', date: iso, time: '', id: '' }));
  }
}

function saveEvents(btn) {
  const events = [...$('#evs tbody').rows].map(tr => {
    const [d, l, t, o] = tr.querySelectorAll('input');
    return { id: tr.dataset.id, kind: tr.dataset.kind, date: d.value, label: l.value, time: t.value, off: o.checked };
  }).filter(e => e.date);
  const wrong = events.filter(e => !e.date.startsWith(M()));
  if (wrong.length) return alert(`${M()}에 속하지 않는 날짜가 있습니다: ${wrong.map(e => e.date).join(', ')}`);
  act(btn, { action: 'saveEvents', events });
}

function table1(open) {
  if (!open.length) return '<p class="muted">연습 일정이 없습니다.</p>';
  const byName = Object.fromEntries(D.members.map(m => [m.name, posOf(m)]));
  const positions = [...new Set([...POSITIONS, ...D.members.flatMap(posOf)])];
  const cols = open.map(ev => D.responses.filter(r => r.eventId === ev.id && r.attend === 'Y').map(r => r.name));
  return `<table><caption>${M()} 연습 참석 현황</caption>
    <thead><tr><th>포지션</th>${open.map(ev => `<th>${fmt(ev.date)}<br><small>${esc(ev.label)}</small></th>`).join('')}</tr></thead>
    <tbody>${positions.map(p => `<tr><th>${esc(p)}</th>${cols.map(ns =>
      `<td>${ns.filter(n => byName[n]?.includes(p)).map(esc).join('<br>')}</td>`).join('')}</tr>`).join('')}
    <tr class="sum"><th>참석 인원</th>${cols.map(ns => `<td>${ns.length}명</td>`).join('')}</tr></tbody></table>`;
}

function table2(evById) {
  const byName = Object.fromEntries(D.members.map(m => [m.name, m]));
  const rows = D.responses
    .filter(r => r.attend === 'N' && evById[r.eventId]?.off !== 'TRUE' && evById[r.eventId])
    .sort((a, b) => (evById[a.eventId].date + a.name).localeCompare(evById[b.eventId].date + b.name));
  if (!rows.length) return '<p class="muted">불참자가 없습니다.</p>';
  return `<table><caption>${M()} 불참자</caption>
    <thead><tr><th>날짜</th><th>이름</th><th>포지션</th><th>사유</th><th>주일 예배</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(evName(evById[r.eventId]))}</td><td>${esc(r.name)}</td>
      <td>${esc(posOf(byName[r.name]).join(', '))}</td><td>${esc(r.reason)}</td>
      <td class="${r.sundayOk === 'Y' ? 'ok' : 'no'}">${r.sundayOk === 'Y' ? '가능' : '불가'}</td></tr>`).join('')}</tbody></table>`;
}

// 표 이미지 저장, 요청 승인/반려, 행 삭제는 이벤트 위임으로 처리한다.
document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('del')) t.closest('tr').remove();
  if (t.dataset.ok) act(t, { action: 'decide', approve: true, ids: [t.dataset.ok] });
  if (t.dataset.no) act(t, { action: 'decide', approve: false, ids: [t.dataset.no] });
  if (t.dataset.png) {
    const table = $('#' + t.dataset.png + ' table');
    if (!table) return alert('저장할 표가 없습니다.');
    run(t, async () => {
      const c = await html2canvas(table, { scale: 2, backgroundColor: '#fff' });
      const a = document.createElement('a');
      a.href = c.toDataURL('image/png');
      a.download = `${M()}-${t.dataset.png === 't1' ? '참석현황' : '불참자'}.png`;
      a.click();
    });
  }
});

$('#month').value = nextMonth();
$('#month').onchange = load;
load();
</script>
</body>
</html>
